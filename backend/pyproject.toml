[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safebank-backend"
version = "0.1.0"
description = "Privacy-first, passwordless and coercion-aware backend for SafeBank AI"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "SafeBank AI Team" }]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore:'asyncio.get_event_loop_policy' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
